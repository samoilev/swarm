name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      # FamilyTreeCore is the pure logic library; building it first surfaces
      # API/access-control breaks before the slower SwiftUI app target.
      - name: Build FamilyTreeCore
        run: swift build --target FamilyTreeCore

      - name: Build (all targets)
        run: swift build

      # Full Xcode on the runner provides the Swift Testing frameworks, so plain
      # `swift test` works here (locally, Scripts/run-tests.sh adds the paths).
      - name: Test
        run: swift test

  lint:
    name: SwiftFormat
    runs-on: macos-15
    env:
      # Pin the formatter version so an upstream release with changed default rules
      # can't fail CI without a code change. Bump this deliberately. Mint builds the
      # exact tag from source, so no reliance on release-asset packaging.
      SWIFTFORMAT_VERSION: "0.61.1"
    steps:
      - uses: actions/checkout@v7
      - name: Install Mint
        run: brew install mint
      - name: Check formatting (pinned SwiftFormat)
        run: mint run nicklockwood/SwiftFormat@${SWIFTFORMAT_VERSION} --lint .
