name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; no job here writes to the repository or publishes anything.
permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-26
    steps:
      # Pinned to a full commit SHA: a tag can be moved, a SHA cannot. Dependabot
      # bumps this and updates the trailing version comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select latest stable Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      # SwarmCore is the pure logic library; building it first surfaces
      # API/access-control breaks before the slower SwiftUI app target.
      - name: Build SwarmCore
        run: swift build --target SwarmCore

      - name: Build (all targets)
        run: swift build

      # Full Xcode on the runner provides the Swift Testing frameworks, so plain
      # `swift test` works here (locally, Scripts/run-tests.sh adds the paths).
      - name: Test
        run: swift test

  lint:
    name: SwiftFormat
    runs-on: macos-26
    env:
      # Pin the formatter version so an upstream release with changed default rules
      # can't fail CI without a code change. Bump this deliberately. Mint builds the
      # exact tag from source, so no reliance on release-asset packaging.
      SWIFTFORMAT_VERSION: "0.61.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Mint
        run: brew install mint
      - name: Check formatting (pinned SwiftFormat)
        run: mint run nicklockwood/SwiftFormat@${SWIFTFORMAT_VERSION} --lint .
