name: CI

# macOS runners bill at a 10x minute multiplier on a private repo, so every
# minute saved here is ten off the bill. Two rules follow from that: only work
# that genuinely needs macOS runs on macOS, and doc-only pushes run nothing.
# The two paths-ignore lists are duplicated because GitHub Actions does not
# support YAML anchors. Keep them in sync.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; no job here writes to the repository or publishes anything.
permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-26
    steps:
      # Pinned to a full commit SHA: a tag can be moved, a SHA cannot. Dependabot
      # bumps this and updates the trailing version comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select latest stable Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      # The package has no external dependencies, so this caches compiled objects
      # of our own code, not checkouts. The exact key almost never hits; the value
      # is the restore-key fallback letting SwiftPM rebuild only what changed.
      # index-build is a SourceKit artifact that CI never produces — excluded so a
      # stale local copy can't bloat the cache.
      # ponytail: worth it only while restore+save is cheaper than the rebuild it
      # saves. Watch the step timings; if they aren't, delete this step.
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            !.build/index-build
          key: spm-${{ runner.os }}-${{ hashFiles('**/*.swift', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build (all targets)
        run: swift build

      # Full Xcode on the runner provides the Swift Testing frameworks, so plain
      # `swift test` works here (locally, Scripts/run-tests.sh adds the paths).
      - name: Test
        run: swift test

  # Formatting is a text check with no Apple dependency, so it runs on Ubuntu at
  # the 1x rate instead of macOS at 10x.
  lint:
    name: SwiftFormat
    runs-on: ubuntu-latest
    container: swift:6.2
    env:
      # Pin the formatter version so an upstream release with changed default rules
      # can't fail CI without a code change. Bump this deliberately. The binary is
      # built from the exact tag, so no reliance on release-asset packaging.
      SWIFTFORMAT_VERSION: "0.61.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Keyed on the version alone: the same tag always produces the same binary,
      # so this is a hit on every run until SWIFTFORMAT_VERSION changes.
      - name: Cache SwiftFormat binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: swiftformat-bin
          key: swiftformat-${{ runner.os }}-${{ env.SWIFTFORMAT_VERSION }}

      # The clone goes outside the checkout on purpose: anything left inside it
      # would be linted as if it were our source.
      - name: Build pinned SwiftFormat (cache miss only)
        run: |
          if [ -x swiftformat-bin/swiftformat ]; then exit 0; fi
          src="$RUNNER_TEMP/swiftformat-src"
          git clone --depth 1 --branch "$SWIFTFORMAT_VERSION" \
            https://github.com/nicklockwood/SwiftFormat "$src"
          swift build -c release --package-path "$src" --product swiftformat
          mkdir -p swiftformat-bin
          cp "$src/.build/release/swiftformat" swiftformat-bin/

      - name: Check formatting
        run: ./swiftformat-bin/swiftformat --lint .

      # The app floors at macOS 15 but is built against the 26 SDK, so every macOS 26
      # API has to sit behind an availability check. All of those live in one file.
      # Text-only, so it runs here on Ubuntu at 1x rather than on a 10x macOS runner.
      #
      # This is a containment check, not a crash guard: with the deployment target at
      # 15.0 the compiler already rejects an unguarded 26-only symbol. What it stops is
      # the guards spreading back out to 116 call sites, which is what made the app
      # hard to back-deploy in the first place.
      # 3.5.3 and 3.5.4 both shipped with every guard in the shim file reading
      # `macOS 99.0` — a local hack for previewing the fallback path that was committed
      # by mistake. 99 is never true, so the whole app silently ran its macOS 15
      # rendering on every machine. Nothing caught it: it builds, the tests pass, the
      # formatter is happy, and the containment check below excludes this very file.
      # The shim is the one place allowed to spell an availability check, so the one
      # version it may name is the real floor.
      - name: The shim's availability guards are real
        run: |
          if grep -nE '(if|guard) #available\(macOS' Swarm/App/Theme/SepiaGlass.swift \
              | grep -v '#available(macOS 26\.0, \*)'; then
            echo "::error::SepiaGlass.swift has an availability guard that is not macOS 26.0 (a preview hack?)." >&2
            exit 1
          fi

      - name: Liquid Glass stays behind one shim
        run: |
          if grep -rn --include='*.swift' --exclude='SepiaGlass.swift' \
              -E '\.glassEffect\(|GlassEffectContainer|buttonStyle\(\.glass|\.sharedBackgroundVisibility\(|[^a]ToolbarSpacer\(|#available\(macOS' Swarm/; then
            echo "::error::macOS 26 API outside Swarm/App/Theme/SepiaGlass.swift (see the shims there)." >&2
            exit 1
          fi
