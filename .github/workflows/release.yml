name: Release

# Tag a version to publish it: `git tag v2.2.0 && git push origin v2.2.0`.
# The DMG is built here rather than on a laptop so every published build comes
# from a clean checkout with a recorded log.
on:
  push:
    tags: ["v*"]

# Needed to create the release and upload the DMG. Nothing else writes.
permissions:
  contents: write

jobs:
  build:
    name: Build DMG
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select latest stable Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # A tag that disagrees with VERSION would produce a DMG whose filename
      # contradicts the release it is attached to. The README carries the version
      # in two places that are easy to forget. Fail early on any mismatch.
      - name: Check the tag, VERSION and README agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($version)" >&2
            exit 1
          fi
          grep -q "badge/release-${version}-" README.md \
            || { echo "README release badge is not $version" >&2; exit 1; }
          grep -q "Swarm-${version}.dmg.sha256" README.md \
            || { echo "README checksum example is not $version" >&2; exit 1; }

      # build_dmg.sh runs the test suite before building, so a failing test
      # blocks the release rather than shipping.
      - name: Build DMG
        run: ./build_dmg.sh

      # 2.2.0 shipped a DMG that crashed on every machine except the one that built
      # it: SwiftPM's Bundle.module falls back to an absolute .build path, which only
      # the build machine has. Hiding .build reproduces a user's machine exactly, so
      # a resource that is missing from the .app is fatal here instead of on download.
      - name: Smoke-test the packaged app without the build directory
        run: |
          cp -R dist/Swarm.app "$RUNNER_TEMP/Swarm.app"
          mv .build .build-hidden
          "$RUNNER_TEMP/Swarm.app/Contents/MacOS/Swarm" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 15
          kill "$pid" 2>/dev/null || true
          mv .build-hidden .build
          echo "--- app output ---"
          cat "$RUNNER_TEMP/app.log" || true
          if grep -qiE "could not load resource bundle|Fatal error" "$RUNNER_TEMP/app.log"; then
            echo "::error::The packaged app cannot load its resources without the build directory." >&2
            exit 1
          fi

      # Handed to the back-deployment jobs below rather than published straight away:
      # the DMG now has to run on macOS 15 and on Intel before it is allowed out.
      - name: Upload the DMG for the back-deployment jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dmg
          path: dist/Swarm-*.dmg*
          retention-days: 1
          if-no-files-found: error

  # The whole point of the macOS 15 floor and the universal binary. Everything before
  # this job is a compile-time claim; this is the only step that actually runs the
  # shipped bits on an older OS and on Intel. `macos-15-intel` is also the only x86_64
  # coverage in the project — `swift test` only ever exercises the host slice.
  back-deploy:
    name: Smoke-test on ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download the DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dmg

      - name: Launch the app from the DMG
        run: |
          set -euo pipefail
          dmg="$(ls Swarm-*.dmg)"
          hdiutil attach "$dmg" -nobrowse -quiet -mountpoint "$RUNNER_TEMP/mnt"
          cp -R "$RUNNER_TEMP/mnt/Swarm.app" "$RUNNER_TEMP/Swarm.app"
          hdiutil detach "$RUNNER_TEMP/mnt" -quiet

          bin="$RUNNER_TEMP/Swarm.app/Contents/MacOS/Swarm"
          echo "Runner arch: $(uname -m)"
          echo "Binary slices: $(lipo -archs "$bin")"
          lipo -archs "$bin" | grep -q "$(uname -m)" \
            || { echo "::error::No $(uname -m) slice in the shipped binary." >&2; exit 1; }

          "$bin" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 15
          # Still alive after 15s is the pass condition: a missing symbol on an older
          # OS kills the process at launch, long before this.
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "--- app output ---"; cat "$RUNNER_TEMP/app.log" || true
            echo "::error::The app exited on $(sw_vers -productVersion) / $(uname -m)." >&2
            exit 1
          fi
          kill "$pid" 2>/dev/null || true

          echo "--- app output ---"; cat "$RUNNER_TEMP/app.log" || true
          if grep -qiE "could not load resource bundle|Fatal error|dyld\[|Symbol not found" \
              "$RUNNER_TEMP/app.log"; then
            echo "::error::Launch errors on $(sw_vers -productVersion) / $(uname -m)." >&2
            exit 1
          fi

  # Ubuntu on purpose: this job only runs `gh`, and macOS runners bill at 10x.
  publish:
    name: Publish release
    needs: [build, back-deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dmg
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          {
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for what changed."
            echo
            echo "## Install"
            echo
            echo "Open the DMG and drag Swarm to Applications."
            echo
            echo "This build is **not signed with an Apple Developer ID and is not notarized**, so the"
            echo "first launch is blocked. Open it once, then allow it under **System Settings ▸ Privacy"
            echo "& Security ▸ Open Anyway**. You only need to do this once. (Right-click ▸ Open no"
            echo "longer works for an unsigned app on current macOS.)"
            echo
            echo "Universal binary (Apple silicon and Intel), macOS 15 or later. On macOS 26 and later"
            echo "the interface is drawn in Liquid Glass. Prefer to build it yourself? See the"
            echo "[README](https://github.com/${GITHUB_REPOSITORY}#build-and-run)."
            echo
            echo "## Verify the download"
            echo
            echo '```sh'
            echo "shasum -a 256 -c Swarm-${version}.dmg.sha256"
            echo '```'
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Swarm ${version}" \
            --notes-file release-notes.md \
            "dist/Swarm-${version}.dmg" \
            "dist/Swarm-${version}.dmg.sha256"
